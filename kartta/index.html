<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Suojattu kartta</title>

<style>
body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.login {
    text-align: center;
}

input {
    padding: 10px;
    font-size: 16px;
}

button {
    padding: 10px 20px;
    font-size: 16px;
}

#error {
    color: red;
}
</style>
</head>

<body>

<div class="login">
    <h2>Suojattu kartta</h2>

    <input
        type="password"
        id="password"
        placeholder="Salasana"
        onkeydown="if(event.key === 'Enter') login()"
    >

    <button onclick="login()">Avaa</button>

    <p id="error"></p>
</div>

<script>
const OIKEA_SALASANA = "salasana123";
const VOIMASSA_MS = 24 * 60 * 60 * 1000; // 24 tuntia

function tarkistaKirjautuminen() {
    const kirjautuminen = localStorage.getItem("kartta_login");

    if (!kirjautuminen) {
        return;
    }

    const kirjautumisaika = Number(kirjautuminen);

    if (Date.now() - kirjautumisaika < VOIMASSA_MS) {
        window.location.href = "map.html";
    } else {
        localStorage.removeItem("kartta_login");
    }
}

function login() {
    const password = document.getElementById("password").value;

    if (password === OIKEA_SALASANA) {
        localStorage.setItem("kartta_login", Date.now());
        window.location.href = "map.html";
    } else {
        document.getElementById("error").textContent =
            "Väärä salasana.";
    }
}

tarkistaKirjautuminen();
</script>

</body>
</html>
